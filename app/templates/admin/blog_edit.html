{% extends "admin/base.html" %}

{% block admin_content %}
<div class="max-w-4xl mx-auto space-y-6">
    
    <div class="flex items-center justify-between">
        <div>
            <h2 class="text-xl font-bold text-slate-900">
                {{ 'ویرایش مقاله: ' + post.title if post else 'افزودن مقاله جدید' }}
            </h2>
            <p class="text-xs text-slate-500 mt-1">تولید محتوای متنی، انتخاب تصویر شاخص و متاتگ‌های سئو</p>
        </div>
        <a href="/admin/blog" class="text-xs font-bold text-slate-500 hover:text-slate-800">
            ← بازگشت به لیست مقالات
        </a>
    </div>

    <form action="/admin/blog/save" method="post" class="bg-white rounded-2xl border border-slate-200/80 p-6 sm:p-8 shadow-sm space-y-6">
        {% if post %}
        <input type="hidden" name="post_id" value="{{ post.id }}">
        {% endif %}

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">عنوان مقاله *</label>
                <input type="text" name="title" required value="{{ post.title if post else '' }}" 
                       placeholder="مثال: ۵ ویژگی بهترین تراش‌های فانتزی اداری"
                       class="w-full p-3 rounded-xl border border-slate-200 text-sm focus:border-blue-600 bg-slate-50">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">اسلاگ یکتا (URL Slug) *</label>
                <input type="text" name="slug" required value="{{ post.slug if post else '' }}" 
                       placeholder="best-sharpener-features-guide"
                       class="w-full p-3 rounded-xl border border-slate-200 text-sm focus:border-blue-600 bg-slate-50" dir="ltr">
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">دسته‌بندی</label>
                <input type="text" name="category" value="{{ post.category if post else 'راهنمای خرید' }}"
                       class="w-full p-3 rounded-xl border border-slate-200 text-sm focus:border-blue-600 bg-slate-50">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">نویسنده</label>
                <input type="text" name="author_name" value="{{ post.author_name if post else 'مدیریت' }}"
                       class="w-full p-3 rounded-xl border border-slate-200 text-sm focus:border-blue-600 bg-slate-50">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">برچسب‌ها (با کاما جدا کنید)</label>
                <input type="text" name="tags" value="{{ post.tags if post else 'تراش, نوشت افزار, پنتر' }}"
                       placeholder="تراش, پنتر, اداری"
                       class="w-full p-3 rounded-xl border border-slate-200 text-sm focus:border-blue-600 bg-slate-50">
            </div>
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5">تصویر شاخص (URL یا آپلود)</label>
            <input type="text" name="featured_image" value="{{ post.featured_image if post else '' }}" 
                   placeholder="https://images.unsplash.com/..."
                   class="w-full p-3 rounded-xl border border-slate-200 text-sm focus:border-blue-600 bg-slate-50" dir="ltr">
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5">چکیده مقاله (Excerpt)</label>
            <textarea name="excerpt" rows="2" placeholder="چکیده کوتاه جهت نمایش در لیست مقالات..."
                      class="w-full p-3 rounded-xl border border-slate-200 text-sm bg-slate-50">{{ post.excerpt if post else '' }}</textarea>
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5">متن کامل مقاله (HTML/متن) *</label>
            <textarea name="content" rows="10" required placeholder="محتوای جامع، سرفصل‌ها و توضیحات مقاله..."
                      class="w-full p-3 rounded-xl border border-slate-200 text-sm bg-slate-50 leading-relaxed font-sans">{{ post.content if post else '' }}</textarea>
        </div>

        <div class="border-t border-slate-100 pt-6 space-y-4">
            <h3 class="text-xs font-bold text-slate-900 border-r-4 border-blue-600 pr-2">تنظیمات متاتگ‌های سئو (SEO)</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">عنوان سئو (Meta Title)</label>
                    <input type="text" name="meta_title" value="{{ post.meta_title if post else '' }}" 
                           placeholder="عنوان جهت گوگل..."
                           class="w-full p-2.5 rounded-xl border border-slate-200 text-xs bg-slate-50">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">توضیحات متا (Meta Description)</label>
                    <input type="text" name="meta_description" value="{{ post.meta_description if post else '' }}" 
                           placeholder="توضیحات کوتاه جهت نمایش در نتایج موتورهای جستجو..."
                           class="w-full p-2.5 rounded-xl border border-slate-200 text-xs bg-slate-50">
                </div>
            </div>
        </div>

        <div class="pt-4 flex items-center justify-between border-t border-slate-100">
            <label class="inline-flex items-center gap-2 cursor-pointer text-xs font-bold text-slate-700">
                <input type="checkbox" name="is_published" value="1" {% if not post or post.is_published %}checked{% endif %} class="w-4 h-4 rounded text-blue-600">
                <span>انتشار عمومی مقاله</span>
            </label>

            <button type="submit" class="px-7 py-3 rounded-xl bg-blue-600 text-white font-bold text-sm hover:bg-blue-700 shadow-md transition-colors flex items-center gap-2">
                <i data-lucide="check" class="w-4 h-4"></i>
                <span>ذخیره مقاله</span>
            </button>
        </div>
    </form>

</div>
{% endblock %}
