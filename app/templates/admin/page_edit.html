{% extends "admin/base.html" %}

{% block admin_content %}
<div class="max-w-4xl mx-auto space-y-6">
    
    <div class="flex items-center justify-between">
        <div>
            <h2 class="text-xl font-bold text-slate-900">
                {{ 'ویرایش برگه: ' + page.title if page else 'افزودن برگه جدید' }}
            </h2>
            <p class="text-xs text-slate-500 mt-1">ساخت محتوای سفارشی و تنظیم اسلاگ اختصاصی</p>
        </div>
        <a href="/admin/pages" class="text-xs font-bold text-slate-500 hover:text-slate-800">
            ← بازگشت به لیست برگه‌ها
        </a>
    </div>

    <form action="/admin/pages/save" method="post" class="bg-white rounded-2xl border border-slate-200/80 p-6 sm:p-8 shadow-sm space-y-6">
        {% if page %}
        <input type="hidden" name="page_id" value="{{ page.id }}">
        {% endif %}

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">عنوان برگه *</label>
                <input type="text" name="title" required value="{{ page.title if page else '' }}" 
                       placeholder="مثال: قوانین و مقررات خرید"
                       class="w-full p-3 rounded-xl border border-slate-200 text-sm focus:border-blue-600 bg-slate-50">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">اسلاگ یکتا (URL Slug) *</label>
                <input type="text" name="slug" required value="{{ page.slug if page else '' }}" 
                       placeholder="terms-and-conditions"
                       class="w-full p-3 rounded-xl border border-slate-200 text-sm focus:border-blue-600 bg-slate-50" dir="ltr">
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">قالب نمایشی</label>
                <select name="template_type" class="w-full p-3 rounded-xl border border-slate-200 text-sm bg-slate-50">
                    <option value="standard" {% if not page or page.template_type == 'standard' %}selected{% endif %}>قالب استاندارد (Standard)</option>
                    <option value="fullwidth" {% if page and page.template_type == 'fullwidth' %}selected{% endif %}>تمام صفحه (Fullwidth)</option>
                    <option value="landing" {% if page and page.template_type == 'landing' %}selected{% endif %}>صفحه فرود / لندینگ (Landing)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">ترتیب نمایش</label>
                <input type="number" name="sort_order" value="{{ page.sort_order if page else 0 }}"
                       class="w-full p-3 rounded-xl border border-slate-200 text-sm bg-slate-50">
            </div>
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5">چکیده برگه (اختیاری)</label>
            <textarea name="excerpt" rows="2" placeholder="توضیح خلاصه جهت نمایش در نتایج یا بالای صفحه..."
                      class="w-full p-3 rounded-xl border border-slate-200 text-sm bg-slate-50">{{ page.excerpt if page else '' }}</textarea>
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5">متن کامل و محتوای صفحه (HTML/متن) *</label>
            <textarea name="body_content" rows="10" required placeholder="محتوای متنی، پاراگراف‌ها، عناوین و جداول صفحه..."
                      class="w-full p-3 rounded-xl border border-slate-200 text-sm bg-slate-50 leading-relaxed font-sans">{{ page.body_content if page else '' }}</textarea>
        </div>

        <div class="border-t border-slate-100 pt-6 space-y-4">
            <h3 class="text-xs font-bold text-slate-900 border-r-4 border-blue-600 pr-2">تنظیمات متاتگ‌های سئو (SEO)</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">عنوان سئو (Meta Title)</label>
                    <input type="text" name="meta_title" value="{{ page.meta_title if page else '' }}" 
                           placeholder="خرید و شرایط ارسال | فروشگاه ما"
                           class="w-full p-2.5 rounded-xl border border-slate-200 text-xs bg-slate-50">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">توضیحات متا (Meta Description)</label>
                    <input type="text" name="meta_description" value="{{ page.meta_description if page else '' }}" 
                           placeholder="شرح کامل شرایط ثبت سفارش، پشتیبانی و خدمات ما..."
                           class="w-full p-2.5 rounded-xl border border-slate-200 text-xs bg-slate-50">
                </div>
            </div>
        </div>

        <div class="pt-4 flex items-center justify-between border-t border-slate-100">
            <label class="inline-flex items-center gap-2 cursor-pointer text-xs font-bold text-slate-700">
                <input type="checkbox" name="is_published" value="1" {% if not page or page.is_published %}checked{% endif %} class="w-4 h-4 rounded text-blue-600">
                <span>انتشار عمومی برگه</span>
            </label>

            <button type="submit" class="px-7 py-3 rounded-xl bg-blue-600 text-white font-bold text-sm hover:bg-blue-700 shadow-md transition-colors flex items-center gap-2">
                <i data-lucide="check" class="w-4 h-4"></i>
                <span>ذخیره برگه</span>
            </button>
        </div>
    </form>

</div>
{% endblock %}
